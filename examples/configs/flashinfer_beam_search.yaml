# Beam search config for FlashInfer contest kernel optimization.
#
# Usage:
#   python examples/run_flashinfer.py \
#       --definition moe_fp8_block_scale_e256_h7168_i2048_topk8 \
#       --strategy flashinfer_beam_search \
#       --max-rounds 10

strategy: beam_search
num_workers: 4
strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2
openai_model: gpt-5.5
high_reasoning_effort: true

# Worker configuration
benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0
target_platform: cuda
gpu_name: "NVIDIA H200 SXM 141GB"
# flashinfer-bench target hardware string written into solution.json
flashinfer_target_hardware: "nvidia_h200"
