# Beam search strategy for CuteDSL kernels on SM100 (Blackwell / B200).
#
# Usage:
#   python examples/run_opt_manager.py \
#       --kernel-dir examples/optimize_01_matvec \
#       --strategy beam_search \
#       --config examples/configs/cutedsl_beam_search.yaml

strategy: beam_search
num_workers: 4
strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2
openai_model: gpt-5.5

# Kernel language: selects CuteDSL benchmarking and LLM guidelines
kernel_language: cutedsl

# Worker configuration
benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0

# Use "cutedsl" target_platform for CuteDSL-specific LLM guidance.
# The underlying hardware platform components (profiler, roofline, etc.)
# remain "nvidia" since CuteDSL kernels run on CUDA/NCU-capable hardware.
target_platform: cutedsl
gpu_name: "NVIDIA H200 SXM 141GB"
